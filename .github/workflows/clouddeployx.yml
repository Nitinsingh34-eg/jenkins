name: CloudDeployX Deployment

on:
  repository_dispatch:
    types: [clouddeployx_deployment]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Notify CloudDeployX - Deployment Running
        run: |
          curl -X PUT \
            "${{ github.event.client_payload.deploymentApiUrl }}/deployments/${{ github.event.client_payload.projectId }}/${{ github.event.client_payload.deploymentId }}/status" \
            -H "Content-Type: application/json" \
            -H "x-ci-secret: ${{ github.event.client_payload.ciSecret }}" \
            -d '{
              "status": "running",
              "branch": "${{ github.event.client_payload.branch }}",
              "logs": "[GITHUB ACTIONS] CI/CD pipeline started successfully."
            }'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Application
        run: |
          echo "Repository successfully checked out"
          ls -la

          if [ -f "index.html" ]; then
            echo "Static HTML application detected."
          else
            echo "index.html not found!"
            exit 1
          fi

      - name: Deployment Complete
        run: |
          echo "CloudDeployX deployment pipeline completed successfully"

      - name: Notify CloudDeployX - Deployment Success
        if: success()
        run: |
          curl -X PUT \
            "${{ github.event.client_payload.deploymentApiUrl }}/deployments/${{ github.event.client_payload.projectId }}/${{ github.event.client_payload.deploymentId }}/status" \
            -H "Content-Type: application/json" \
            -H "x-ci-secret: ${{ github.event.client_payload.ciSecret }}" \
            -d '{
              "status": "success",
              "branch": "${{ github.event.client_payload.branch }}",
              "logs": "[GITHUB ACTIONS] CI/CD pipeline completed successfully."
            }'

      - name: Notify CloudDeployX - Deployment Failed
        if: failure()
        run: |
          curl -X PUT \
            "${{ github.event.client_payload.deploymentApiUrl }}/deployments/${{ github.event.client_payload.projectId }}/${{ github.event.client_payload.deploymentId }}/status" \
            -H "Content-Type: application/json" \
            -H "x-ci-secret: ${{ github.event.client_payload.ciSecret }}" \
            -d '{
              "status": "failed",
              "branch": "${{ github.event.client_payload.branch }}",
              "logs": "[GITHUB ACTIONS] CI/CD pipeline failed."
            }'
